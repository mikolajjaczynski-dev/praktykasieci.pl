<html lang="pl">
<head>

<title>Mikołaj Jaczyński · Sieci wod-kan w praktyce</title>
<meta name="description" content="Mikołaj Jaczyński — Sieci wod-kan w praktyce: modelowanie, analizy, strefowanie, doradztwo. Strona w budowie.">

<style>
:root{--paper:#eceeeb;--surface:#ffffff;--ink:#12232e;--muted:#546572;--line:#d5dde2;--glebia:#0f2e44;--wodociag:#1d5a85;--ton:#dce9f1;--kamionka:#8b5a36;--zielen:#2e7d5b;--zgodne:#2e7d5b;--uwaga:#9a6512;--niezgodne:#b3412f;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0a141b;--surface:#15242e;--ink:#e8eef1;--muted:#9db0bc;--line:#2a3c48;--glebia:#24577b;--wodociag:#6fa8d0;--ton:#1b3546;--kamionka:#c9946a;--zielen:#5fbf92;--zgodne:#5fbf92;--uwaga:#e0a84a;--niezgodne:#ec8a78}}
:root[data-theme="dark"]{--paper:#0a141b;--surface:#15242e;--ink:#e8eef1;--muted:#9db0bc;--line:#2a3c48;--glebia:#24577b;--wodociag:#6fa8d0;--ton:#1b3546;--kamionka:#c9946a;--zielen:#5fbf92;--zgodne:#5fbf92;--uwaga:#e0a84a;--niezgodne:#ec8a78}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh}
/* całość mieści się w wysokości okna: wizytówka i animacja skalują się do 100vh */
:root{--pad:clamp(10px,2vh,20px);--gap:clamp(10px,1.8vh,18px);--lw:min(600px,62vh);--lh:calc(var(--lw)*.3667);--sw:min(900px,max(620px,calc((100vh - var(--lh) - 2*var(--pad) - var(--gap) - 50px)*1.6)))}
main{max-width:960px;margin:0 auto;padding:var(--pad) 16px;display:flex;flex-direction:column;align-items:center;gap:var(--gap)}

/* 1. wizytówka (logo poziome / pionowe) */
.logo{width:100%;max-width:var(--sw);display:block;margin:0;background:#ffffff}
.logo svg{display:block;width:100%;max-width:var(--lw);height:auto;margin:0 auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#0f2e44}}
.l-bg{fill:#ffffff}.l-nm{fill:#0f2e44}.l-tg{fill:#8b5a36}.l-sv{fill:#3c4d59}.l-dash{fill:#2e7d5b}
.logo svg{--zw:#1d5a85;--zk:#8b5a36;--znw:#0f2e44;--znk:#8b5a36;--zg:#2e7d5b;--zr:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo svg{--zw:#6fa8d0;--zk:#c9946a;--znw:#0f2e44;--znk:#c9946a;--zg:#5fbf92;--zr:#ffffff}
 :root:not([data-theme="light"]) .l-bg{fill:#0f2e44}:root:not([data-theme="light"]) .l-nm{fill:#ffffff}:root:not([data-theme="light"]) .l-tg{fill:#6fa8d0}:root:not([data-theme="light"]) .l-sv{fill:#c9d6df}:root:not([data-theme="light"]) .l-dash{fill:#5fbf92}}
.l-nm{font-family:var(--font-display);font-weight:600}
.l-tg{font-family:var(--font-sans);font-weight:600;letter-spacing:.16em}
.l-sv{font-family:var(--font-sans);font-weight:400}

/* 2. animacja */
.sheet{width:100%;max-width:var(--sw);background:var(--surface);border:1.5px solid var(--ink)}
#anim{display:block;width:100%;height:auto;cursor:pointer}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding:10px 14px 12px}
.prog button{position:relative;border:0;background:none;padding:0 0 9px;text-align:left;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog button::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
.prog u{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--wodociag)}
.prog button.on{color:var(--ink)}
.prog button:focus-visible{outline:2px solid var(--wodociag);outline-offset:3px}

/* 3. napis */
.wip{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.1;letter-spacing:.01em;margin:0;text-align:center}
.wip i{width:12px;height:12px;border-radius:50%;background:var(--uwaga);flex:none;animation:ping 2.4s infinite}
.wip span::after{content:"…";display:inline-block;overflow:hidden;vertical-align:bottom;width:0;animation:dots 1.8s steps(4) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--uwaga) 55%,transparent)}70%,100%{box-shadow:0 0 0 12px transparent}}
@keyframes dots{to{width:1.05ch}}

/* SVG animacji */
.a-grid{stroke:var(--line);stroke-width:.6}
.a-street{stroke:var(--ton);stroke-width:9;stroke-linecap:round;fill:none}
.a-pipe{stroke:var(--wodociag);stroke-width:2.6;stroke-linecap:round;fill:none}
.a-sew{stroke:var(--kamionka);stroke-width:2.2;fill:none;stroke-linecap:round}
.a-node{fill:var(--surface);stroke:var(--wodociag);stroke-width:2}
.a-tx{font-family:var(--font-mono);font-size:8.5px;fill:var(--muted)}
.a-txb{font-family:var(--font-mono);font-size:11px;fill:var(--ink);font-weight:500}
.a-h{font-family:var(--font-display);font-weight:600;font-size:16px;fill:var(--ink)}
.a-big{font-family:var(--font-display);font-weight:600;font-size:22px;fill:var(--ink)}
.a-sm{font-size:7px}
#anim.port .a-tx{font-size:10px}#anim.port .a-txb{font-size:12px}#anim.port .a-h{font-size:18px}#anim.port .a-big{font-size:24px}#anim.port .a-sm{font-size:8.5px}
.a-panel{fill:var(--paper);stroke:var(--line)}

.hero,.story{width:100%;display:flex;flex-direction:column;align-items:center}
.down,.steps{display:none}
@media (max-width:600px){
 html{scroll-snap-type:y mandatory}
 main{padding:0;gap:0}
 .hero{height:100vh;height:100svh;justify-content:center;gap:28px;padding:0 16px;scroll-snap-align:start}
 .down{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;animation:bob 1.8s ease-in-out infinite}
 .down svg{width:24px;height:24px}
 @keyframes bob{50%{transform:translateY(8px)}}
 .story{position:relative;display:block}
 .sheet{position:sticky;top:0;height:100vh;height:100svh;max-width:none;border:0;display:flex;flex-direction:column;justify-content:center}
 #anim{flex:0 1 auto;min-height:0;max-height:calc(100svh - 52px);width:auto;max-width:100%;margin:0 auto}
 .steps{display:block;margin-top:-100vh;margin-top:-100svh;pointer-events:none}
 .step{height:100vh;height:100svh;scroll-snap-align:start}
 .prog button{font-size:9.5px}
 .prog .lg{display:none}
}
@media (max-width:600px) and (prefers-reduced-motion:reduce){.down{animation:none}}
@media (prefers-reduced-motion:reduce){.wip i,.wip span::after{animation:none}.wip span::after{width:1.05ch}}
</style>

   L4.r1.setAttribute('r',done?7:7+4*Math.abs(Math.sin(w*3+i)));L4.r1.setAttribute('stroke',done?'var(--zgodne)':'var(--niezgodne)')});
  curtain.setAttribute('opacity',Math.max(1-ramp(t,0,.6),ramp(t,58.9,59.5)));
 };
}

const tabs=[...document.querySelectorAll('#prog button')];
const ui=t=>tabs.forEach((b,i)=>{const a=PH[i][0],e=i===3?T:PH[i][1];b.querySelector('u').style.width=ramp(t,a,e)*100+'%';b.classList.toggle('on',t>=a&&t<e)});

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOB=matchMedia('(max-width:600px)');
let t=reduce?52:0,play=!reduce,last=null,mode=null;
const hm=location.hash.match(/t=([\d.]+)/);if(hm){t=cl(+hm[1],0,T-.01);play=false}
const fit=()=>{const m=S.parentElement.clientWidth<600?'port':'land';if(m!==mode){mode=m;build(m);render(t);ui(t)}};
new ResizeObserver(fit).observe(S.parentElement);fit();

/* telefon: przewijanie etapami + automatyczne przewijanie */
const steps=[...document.querySelectorAll('.step')],hero=document.querySelector('.hero');
let cur=-1,end=T,auto=null;
const ENDS=[PH[0][1]-.5,PH[1][1]-.5,PH[2][1]-.5,58.6];
const go=i=>{const el=i<0?hero:steps[i];if(el)el.scrollIntoView({behavior:reduce?'auto':'smooth'})};
const arm=(i,ms)=>{clearTimeout(auto);auto=setTimeout(()=>{if(MOB.matches)go(i)},ms)};
function setPhase(i){if(i===cur)return;cur=i;clearTimeout(auto);last=null;
 if(i<0){t=.7;play=false;render(t);ui(t);arm(0,4500);return}
 t=PH[i][0]+.01;end=ENDS[i];play=true;render(t);ui(t)}
const io=new IntersectionObserver(es=>{if(!MOB.matches||hm)return;es.forEach(e=>{if(e.isIntersecting){setPhase(e.target===hero?-1:steps.indexOf(e.target))}})},{threshold:.6});
[hero,...steps].forEach(e=>io.observe(e));
document.getElementById('down').addEventListener('click',()=>go(0));
const initMode=()=>{clearTimeout(auto);cur=-2;if(!MOB.matches){end=T;play=!reduce&&!hm;last=null}};
MOB.addEventListener('change',initMode);initMode();

tabs.forEach((b,i)=>b.addEventListener('click',()=>{if(MOB.matches){go(i);return}hold=0;t=+b.dataset.t+.01;render(t);ui(t)}));
S.addEventListener('click',()=>{if(MOB.matches)return;play=!play;last=null});
/* komputer: 1 s pauzy na końcu każdego etapu (etap jeszcze w pełni widoczny) */
const HOLDS=[15.6,29.4,41.5,54.6],SPD=1.25;let hold=0,amb=0;
function loop(ts){
 if(play){const rt=last!==null?Math.min(.1,(ts-last)/1000):0,dt=rt*SPD;last=ts;amb+=dt;
  if(MOB.matches){t+=dt;if(t>=end){t=end;play=false;if(cur>=0&&cur<3)arm(cur+1,1000)}}
  else if(hold>0)hold-=rt;
  else{const tn=t+dt,h=HOLDS.find(x=>t<x&&tn>=x);if(h!==undefined){t=h;hold=1}else t=tn>=T?0:tn}
  render(t,amb);ui(t)}else last=null;
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
